# Builds the plugin on GitHub's computers every time code is pushed.
# The finished plugins show up under the run's "Artifacts" section as zips.
name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  sound-test:
    # Runs every reverb mode through the offline sound test (catches silence, runaway volume, broken numbers).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sound test
        run: |
          g++ -O2 -std=c++17 -o enginetest tests/EngineTest.cpp Source/dsp/ReverbEngine.cpp
          ./enginetest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target SkyReverb_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: SkyReverb-VST3-Windows
          path: build/SkyReverb_artefacts/Release/VST3/

      - name: Check the plugin with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -Wait -PassThru -NoNewWindow -ArgumentList '--strictness-level','5','--timeout-ms','300000','--output-dir','pluginval-log','"build/SkyReverb_artefacts/Release/VST3/Sky Reverb.vst3"'
          Write-Host "pluginval exit code: $($p.ExitCode)"
          Get-ChildItem pluginval-log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-String -Pattern 'FAIL|!!!|Error|crash' }
          if ($p.ExitCode -ne 0) { exit 1 }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release --target SkyReverb_VST3 SkyReverb_AU

      - name: Sign for local use
        run: |
          codesign --force --deep --sign - "build/SkyReverb_artefacts/Release/VST3/Sky Reverb.vst3"
          codesign --force --deep --sign - "build/SkyReverb_artefacts/Release/AU/Sky Reverb.component"

      - name: Upload plugins
        uses: actions/upload-artifact@v5
        with:
          name: SkyReverb-Mac-AU-VST3
          path: |
            build/SkyReverb_artefacts/Release/VST3/
            build/SkyReverb_artefacts/Release/AU/
